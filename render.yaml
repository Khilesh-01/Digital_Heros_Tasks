services:
  - type: web
    name: page-pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://page-pulse.vercel.app
      - key: REQUEST_TIMEOUT_SECONDS
        value: "10"
      - key: CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: MAX_REDIRECTS
        value: "5"
      - key: MAX_RESPONSE_BYTES
        value: "5000000"
      - key: USER_AGENT
        value: "PagePulseBot/1.0 (+https://digitalheroesco.com)"
      - key: MAX_RETRIES
        value: "2"
      - key: RETRY_BACKOFF_SECONDS
        value: "0.5"
      - key: ALLOW_PRIVATE_NETWORK_TARGETS
        value: "false"
      - key: ALLOWED_SCHEMES
        value: "http,https"
